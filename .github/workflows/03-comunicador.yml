# This is a basic workflow to help you get started with Actions

name: Comunidador de la lengión

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envía el mensaje?"
        required: true
        type: choice
        options:  
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac 

jobs:
  transmitir_mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


