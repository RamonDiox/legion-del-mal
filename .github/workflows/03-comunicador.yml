# This is a basic workflow to help you get started with Actions

name: Comunidador de la lengión

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Que villano envía el mensaje?"
        required: true
        type: choice
        options:  
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac 
          - Dos caras
      
      mensaje:
        description: "Mensaje para el consejo"  
        required: true  
        default: "La misión fue un éxito" 

      prioridad:
        description: "Nivel de Prioridad"
        required: true
        type: choice
        options:  
          - Normal
          - Alta
          - Crítica

jobs:
  transmitir_mensaje:
    runs-on: ubuntu-latest

    steps:

      - name: "Instalar el transmisor de la Legión"
        run: sudo apt-get install -y cowsay


      - name: "Imprimir inputs"
        run: |
          echo "========================================="
          echo "       Transmisión interceptada"
          echo "========================================="
          echo "De: ${{inputs.villano}}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "-----Mensaje-----"
          cowsay -f eyes "${{inputs.mensaje}}"
          echo ""
          echo "--- ${{inputs.villano}}"
          echo "..."



